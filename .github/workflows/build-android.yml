name: Build Android APK

on:
  workflow_dispatch:
  # push:
  #   branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-android-${{ runner.os }}-

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # --- SIGNING ---------------------------------------------------------
      # Use a STABLE keystore stored as a secret instead of generating a new,
      # zero-reputation cert on every run (the main controllable cause of the
      # "risk app" warning). Generate it ONCE locally:
      #
      #   keytool -genkeypair -v -keystore app.keystore -alias appkey \
      #     -keyalg RSA -keysize 2048 -validity 10000 \
      #     -storepass <STORE_PASS> -keypass <KEY_PASS> \
      #     -dname "CN=PrepaidTracker, OU=App, O=Personal, L=Dhaka, C=BD"
      #
      # Then base64-encode it and save as repo secrets:
      #   base64 -w0 app.keystore   (Linux)  /  base64 -i app.keystore (macOS)
      #
      # Required secrets:
      #   KEYSTORE_BASE64, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS
      # --------------------------------------------------------------------
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from KEYSTORE_BASE64 secret."
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app.keystore"
            echo "ALIAS=${{ secrets.KEY_ALIAS }}"    >> "$GITHUB_ENV"
            echo "KPASS=${{ secrets.KEY_PASS }}"      >> "$GITHUB_ENV"
            echo "SPASS=${{ secrets.KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          else
            # No secret set — generate one so the build still produces a
            # signed, installable APK with zero setup. NOTE: a fresh key is
            # made each run, so to UPDATE the app on a phone you must
            # uninstall the old version first (signatures won't match).
            echo "No KEYSTORE_BASE64 secret found — generating a keystore for this build."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/app.keystore" \
              -alias appkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=PrepaidTracker, OU=App, O=Personal, L=Dhaka, C=BD"
            echo "ALIAS=appkey"  >> "$GITHUB_ENV"
            echo "KPASS=android" >> "$GITHUB_ENV"
            echo "SPASS=android" >> "$GITHUB_ENV"
          fi
          test -s "$GITHUB_WORKSPACE/app.keystore" || { echo "Keystore was not created."; exit 1; }

      - name: Build the signed APK
        run: |
          # Android-only via the TargetFrameworks override, mirroring the iOS
          # workflow — neither CI job needs the other platform's workload.
          dotnet publish PrepaidTracker/PrepaidTracker.csproj \
            -c Release -f net8.0-android \
            -p:TargetFrameworks=net8.0-android \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:DebugSymbols=false \
            -p:DebugType=none \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/app.keystore" \
            -p:AndroidSigningKeyAlias="$ALIAS" \
            -p:AndroidSigningKeyPass="$KPASS" \
            -p:AndroidSigningStorePass="$SPASS"

      - name: Collect the APK into one file
        run: |
          APK=$(find . -type f -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No signed APK found"; find . -name "*.apk" || true; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/PrepaidTracker.apk"
          ls -lh "$GITHUB_WORKSPACE/PrepaidTracker.apk"

      - name: Upload the APK so you can download it
        uses: actions/upload-artifact@v6
        with:
          name: PrepaidTracker-apk
          path: PrepaidTracker.apk
          if-no-files-found: error
